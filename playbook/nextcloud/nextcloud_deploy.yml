- name: Deploy Nextcloud
  hosts: deployVmIp
  gather_facts: no
  vars:
    ansible_user: root
    ansible_ssh_pass: Ablecloud1!
    httpd_packages:
      - "httpd"
      - "mod_ssl"
      - "mod_security"
    php_packages:
      - "php"
      - "php-gd"
      - "php-mbstring"
      - "php-intl"
      - "php-pecl-apcu"
      - "php-mysqlnd"
      #- "php-pecl-redis"
      - "php-opcache"
      #- "php-imagick"
      - "php-zip"
      - "php-process"
      - "php-json"
      - "php-ldap"
      - "php-xml"
    mariadb_packages:
      - "mariadb-server"
      - "python3-PyMySQL"
    mariadb_root_pass: "password"
    # nextcloud_code: "https://download.nextcloud.com/server/releases/nextcloud-20.0.9.zip"
    nextcloud_code: "https://images.ablecloud.io/genie/nextcloud/nextcloud-25.0.13.zip"
    nextcloud_db_name: "nextcloud"
    nextcloud_db_user: "nextcloud"
    nextcloud_db_pass: "password"
    nextcloud_admin_name: "user"
    nextcloud_admin_pass: "password"
    nextcloud_data_dir: "/var/www/html/nextcloud/data"
  tasks:
  
    - name: Ensure upgrade_only=False in dnf.conf
      lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^upgrade_only='
        line: 'upgrade_only=False'
        create: yes
      become: true

    - name: Add generated public key to authenticated keys
      lineinfile:
        dest: /root/.ssh/authorized_keys
        line: "{{ lookup('env', 'AC_PUB_KEY') }}"

    # Install Httpd
    - name: Install httpd with no update
      ansible.builtin.command:
        cmd: dnf install --nobest -y "{{ item }}"
      loop: "{{ httpd_packages }}"
      become: true

    # Install php
    - name: Install php with no update
      ansible.builtin.command:
        cmd: dnf install --nobest -y "{{ item }}"
      loop: "{{ php_packages }}"
      become: true

    - name: Start httpd service
      systemd: name=httpd state=started enabled=yes

    # Install Mariadb
    - name: Install mariadb with no update
      ansible.builtin.command:
        cmd: dnf install --nobest -y "{{ item }}"
      loop: "{{ mariadb_packages }}"
      become: true

    - name: Start mariadb service
      systemd: name=mariadb state=started enabled=yes

    - name: Configure mariadb - root user
      community.mysql.mysql_user:
        name: root
        password: "{{ mariadb_root_pass }}"
        check_implicit_admin: true
        login_user: root
        login_password: "{{ mariadb_root_pass }}"
        login_unix_socket: "/var/lib/mysql/mysql.sock"
      become: true

    - name: Configure mariadb anonymous user
      community.mysql.mysql_user:
        name: ""
        state: absent
        host_all: true
        login_user: root
        login_password: "{{ mariadb_root_pass }}"
        login_unix_socket: "/var/lib/mysql/mysql.sock"
      become: true

    - name: Configure mariadb - test database
      community.mysql.mysql_db:
        name: test
        state: absent
        login_user: root
        login_password: "{{ mariadb_root_pass }}"
        login_unix_socket: "/var/lib/mysql/mysql.sock"
      become: true

    # Install Nextcloud
    - name: Install dependencies with no update
      ansible.builtin.command:
        cmd: dnf install --nobest -y unzip
      become: true

    - name: Install Nextcloud
      ansible.builtin.unarchive:
        src: "{{ nextcloud_code }}"
        remote_src: true
        dest: "/var/www/html/"
        keep_newer: true
        owner: "apache"
        group: "apache"
        setype: "httpd_sys_rw_content_t"
      become: true

    - name: Restart Httpd
      systemd: name=httpd state=restarted
      become: yes

    - name: Configure Nextcloud - httpd selinux
      ansible.posix.seboolean:
        name: "{{ item }}"
        persistent: true
        state: true
      become: true
      loop:
        - "httpd_can_network_connect_db"
        - "httpd_unified"

    - name: Configure Nextcloud - mariadb db
      community.mysql.mysql_db:
        name: "{{ nextcloud_db_name }}"
        state: "present"
        login_user: "root"
        login_password: "{{ mariadb_root_pass }}"
        login_unix_socket: "/var/lib/mysql/mysql.sock"
      become: true

    - name: Configure Nextcloud - mariadb user
      community.mysql.mysql_user:
        name: "{{ nextcloud_db_user }}"
        password: "{{ nextcloud_db_pass }}"
        priv: "{{ nextcloud_db_name }}.*:ALL"
        login_user: "root"
        login_password: "{{ mariadb_root_pass }}"
        login_unix_socket: "/var/lib/mysql/mysql.sock"
      become: true

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ nextcloud_data_dir }}"
        state: "directory"
        owner: "apache"
        group: "apache"
        mode: 0750
        setype: "httpd_sys_rw_content_t"
      become: true

    - name: Check for CAN_INSTALL
      ansible.builtin.stat:
        path: "/var/www/html/nextcloud/config/CAN_INSTALL"
      register: "r_CAN_INSTALL"
      become: true

    # Install Firewall
    - name: Install firewalld with no update
      ansible.builtin.command:
        cmd: dnf install --nobest -y firewalld
      become: true

    - name: Start firewalld service
      systemd: name=firewalld state=started enabled=yes

    - name: Manage Firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        immediate: true
        permanent: true
      become: true
      loop:
        - "http"
        - "https"
